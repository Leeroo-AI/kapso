[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "leeroo-kapso"
version = "0.3.1"
description = "A Knowledge-grounded framework for Autonomous Program Synthesis and Optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Leeroo Team", email = "team@leeroo.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "ml", "optimization", "code-generation", "llm", "agents"]

# Core dependencies — deliberately lean (onboarding audit 2026-08-26):
# inference runs through the npm coding-agent CLIs, so the pip core is
# config/orchestration + the embedding path + the KG clients. The aider
# adapter moved to an optional extra: it blocked Python 3.13 installs
# outright (no py3.13 aider-chat release) and carried most of a 777MB
# footprint for an agent no production mode uses.
dependencies = [
    "GitPython",
    # Embeddings only since the CLI-inference conversion (2026-08-26);
    # the old reasoning_effort pin rationale died with the completion path.
    "litellm==1.75.0",
    "PyYAML",
    "python-dotenv",
    # MCP SDK — required by kapso.gated_mcp (gate server + all gates).
    # <2 is load-bearing: mcp 2.0 removed the 1.x low-level Server decorator
    # API (Server.list_tools et al.), and an unpinned box install pulled 2.0.0
    # — the gate server then crashed at startup in EVERY box session while
    # dev (1.26.0) kept passing. Found 2026-08-03; migrate server.py to the
    # 2.x API before lifting the ceiling.
    "mcp>=1.9,<2",
    "neo4j",
    # Vector database for the knowledge-base KG search (kg_graph_search); the
    # experiment store no longer uses it (embeddings live in its JSON store).
    "weaviate-client>=4.0.0",
    # Token-count cap for embedding inputs (core/llm.py create_embedding)
    "tiktoken",
    # OpenAI embeddings API
    "openai>=1.0.0",
]

[project.optional-dependencies]
# The aider adapter (legacy; requires Python <3.13). Its pinned deps
# (litellm, openai, cffi) conflict with openhands and browser-use — do
# not install those in the same environment.
aider = [
    "aider-chat>=0.35.0",
    # cffi<2 pin aider needs; kept beside it so the core stays unpinned.
    "cryptography<46.0.0",
]
mle = [
    "neo4j",
    "openai",
    # mlebench installed separately (requires git lfs)
]
ale = [
    # ale-bench installed separately (requires docker setup)
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
kapso = "kapso.cli:main"
expert-mle = "benchmarks.mle.runner:main"
expert-ale = "benchmarks.ale.runner:main"
expert-posttrain = "benchmarks.posttrain.runner:main"
expert-relbench = "benchmarks.relbench.runner:main"

[project.urls]
Homepage = "https://leeroo.com"
Documentation = "https://docs.leeroo.com"
Repository = "https://github.com/leeroo-ai/kapso"
Issues = "https://github.com/leeroo-ai/kapso/issues"

# namespaces=true because benchmarks/ has no __init__.py files (PEP 420);
# without packaging it, the expert-* console scripts crash with
# ModuleNotFoundError in any pip-installed environment.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["kapso*", "benchmarks*"]
exclude = ["benchmarks.posttrain.gcp*", "benchmarks.posttrain.ptb_adapter*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml", "*.md"]
