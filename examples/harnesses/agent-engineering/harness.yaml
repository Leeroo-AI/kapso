  implementation:
    skills: [scaffold-components, tool-layer, verification-and-stop, action-review, context-policy, grounding, deterministic-guards, local-model-serving, done-check-and-eval, episode-triage, support-conversations]
    agents: [episode-auditor]
  verification:
    skills: [done-check-and-eval, episode-triage, verification-and-stop]
    agents: [scaffold-integrity-auditor, episode-auditor]
  feedback:
    skills: [done-check-and-eval]
  deployment:
    skills: [local-model-serving, deterministic-guards]
