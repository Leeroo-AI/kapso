name: Docs

# docs.leeroo.com is built by Mintlify's GitHub app, which deploys whatever is
# on main. That deploy has no gate of its own, and on the Starter plan there are
# no preview deployments either — so a bad docs change reaches production with
# nothing in front of it. This workflow is that gate: it runs the same checks
# Mintlify's builder runs, on the pull request, before main ever sees the change.

# cli.py and kapso.py are in the path list because the coverage check below
# guards the docs against *them*. A new command added without a docs page is
# exactly the drift this workflow exists to catch, and that change touches no
# file under docs/.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'docs.json'
      - '.mintignore'
      - 'scripts/check_docs_coverage.py'
      - 'src/kapso/cli.py'
      - 'src/kapso/kapso.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs.json'
      - '.mintignore'
      - 'scripts/check_docs_coverage.py'
      - 'src/kapso/cli.py'
      - 'src/kapso/kapso.py'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v5 is the first major of both actions to run on Node 24. On v4 the
      # runner forces the upgrade anyway and annotates every run with a
      # deprecation warning; pinning v5 is the same behaviour without the noise,
      # and without the failure when the runner stops forcing it.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pinned to the 4.x line rather than an exact patch. The CLI ships almost
      # daily and the hosted builder tracks it, so an exact pin would drift away
      # from what actually builds the site; a major-version pin keeps CI honest
      # without letting a breaking release land unannounced.
      #
      # Strict mode: this fails on warnings, not just errors. A page referenced
      # in docs.json that does not exist is a warning, and that is exactly the
      # bug that put a 404 in the live navigation.
      - name: Validate the docs build
        run: npx --yes mint@4 validate

      - name: Check for broken links
        run: npx --yes mint@4 broken-links

      # Stdlib only, so no Python setup step is needed beyond the runner's own.
      - name: Check the reference covers the public surface
        run: python3 scripts/check_docs_coverage.py

      # Gates only the objective GEO rules — a page opening with prose, an
      # internal link, no banned marketing word or terminology alias. The
      # question-heading share is printed, never gated: gating a percentage
      # buys the number at the cost of the prose.
      - name: Check the GEO rules
        run: python3 scripts/check_docs_geo.py
