name: Tests

# The unit suite runs on the pull request, before main sees the change. It
# needs no service, key or coding-agent login: tests/live and tests/manual
# do, and stay out.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plugin/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plugin/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Tests commit into throwaway repositories; a bare runner has no identity
      - name: Git identity for the tests
        run: |
          git config --global user.name "kapso-ci"
          git config --global user.email "ci@leeroo.com"

      # The claude_code adapter refuses to construct without the binary and a
      # credential; its unit tests drive fake processes, so the binary and a
      # placeholder key are all they need — nothing here can reach the API
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Unit tests
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-key
          CLAUDE_CODE_OAUTH_TOKEN: ci-placeholder-not-a-token
        run: >
          python -m pytest tests -q
          --ignore=tests/live --ignore=tests/manual
          --deselect tests/test_repo_memory.py::test_render_summary_and_toc_produces_usable_prompt
          --deselect tests/test_repo_memory_latest_commit_semantics.py::test_repo_memory_update_runs_after_final_commit
