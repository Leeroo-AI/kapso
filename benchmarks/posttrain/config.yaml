# PostTrainBench Configuration
#
# Kapso runs INSIDE the PostTrainBench apptainer container (agents/kapso/solve.sh),
# where the available credentials are:
#   - CLAUDE_CODE_OAUTH_TOKEN     (Claude Max subscription, exported by solve.sh
#                                  from the harness-provided oauth_token file —
#                                  the upstream claude_non_api mechanism; drives
#                                  the coding agent, feedback generator, and the
#                                  ensemble's claude members)
#   - OPENAI_API_KEY              (solve.sh bridges it from CODEX_API_KEY — the
#                                  harness's sanctioned agent-credential channel,
#                                  the same one upstream codex scaffolds run on.
#                                  It drives ONLY the litellm roles below; agent
#                                  sessions have it stripped on non-judge tasks
#                                  via env_strip so the workspace looks exactly
#                                  like an official non-judge environment.)
#   - ~/.codex/auth.json          (ChatGPT login file shipped through the
#                                  harness auth.json mechanism; the ensemble's
#                                  codex member authenticates through it)
#
# The litellm roles run gpt-5.6-luna: there is no Anthropic API key in this
# deployment (OAuth cannot serve raw API calls), and the OpenAI key above is
# scaffold-owned, so pointing roles at OpenAI is rule-clean. What stays
# forbidden is agents consuming the judge key on judge-scored tasks — that key
# is reserved for evaluate.py, and env_strip never applies there.
#
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes), not by this file. Per-session deadlines carry no fixed
# caps: the runner shapes them from session_budget fractions of the run size,
# and the orchestrator's live clamp bounds every session by what remains. One
# implementation session may research, write a training pipeline, train for
# hours and self-evaluate.

default_mode: POSTTRAIN

modes:
  POSTTRAIN:
    search_strategy:
      type: "generic"
      params:
        # idea_generation_model (the ideation-base Claude session) is overridden
        # at runtime by `expert-posttrain --coding-model` ($AGENT_CONFIG, e.g.
        # claude-opus-4-8). The IMPLEMENTATION agent runs on codex (gpt-5.6-sol
        # via the ChatGPT login, OPENAI_API_KEY stripped): its model is pinned
        # here and is NOT overridden by --coding-model (runner.py guards it — a
        # Claude label would be invalid for codex).
        idea_generation_model: "claude-opus-4-8"
        implementation_cli: "codex"
        implementation_model: "gpt-5.6-sol"
        auth_mode: "oauth"  # pinned: Claude Max OAuth for ideation/feedback (no Anthropic API key here)
        # A single H100 and a hard deadline: never abort the campaign because a
        # knowledge gate backend (weaviate/neo4j/leeroopedia) is unreachable.
        gate_failure_policy: "skip"
        parent_policy: "best"
        # max for all Claude reasoning sessions (ideation + implementation);
        # the ensemble codex member and the luna litellm roles stay at xhigh
        # (their model ceiling — max is Claude-only, per the ioai configs).
        effort: "max"
        # No session caps at all: ideation and implementation deadlines are
        # the whole run budget, live-clamped to what actually remains.
        # Only local, dependency-free gates. `research` and `leeroopedia`
        # need external backends we don't ship in the container. The coding
        # agent still has Claude Code's built-in WebSearch/WebFetch, which is
        # allowed (internet access is unrestricted in the benchmark).
        # repo_memory disabled: its get_repo_memory_section outputs (kapso/eval
        # harness internals) trip the v1.1 lookup judge as a "benchmark-internal
        # resource"; the agent reads the codebase directly with Read instead.
        ideation_gates: ["experiment_history"]
        # Bash-tool clock policy for every Claude session (set-if-absent in
        # the child env — solve.sh's exports keep precedence in-container;
        # this is the config home so local/debug runs match: without it the
        # CLI auto-backgrounds any foreground command at 120s).
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "36000000"
        # repo_memory disabled (see ideation_gates note); implementation uses
        # only base tools + Read of the codebase.
        implementation_gates: []
        # Ensemble ideation: parallel CLI members + selector-critic. The codex
        # member authenticates via the codex-auth-json secret (ChatGPT login
        # file, shipped by run_startup.sh through the harness's auth.json
        # mechanism) — NEVER via the harness's OPENAI_API_KEY, which on
        # judge-scored tasks is reserved for evaluate.py. Members are pinned
        # here and intentionally NOT overridden by --coding-model.
        ideation_ensemble:
          - cli: "codex"
            model: "gpt-5.6-sol"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "max"
        # Task-aware lens planning: a web-enabled Claude session surveys how
        # this benchmark×model's problem family is attacked and designs one
        # lens per ensemble member (once per campaign → .kapso/lens_plan.json),
        # replacing the fixed lens strings. Web tools work here (internet is
        # unrestricted in the benchmark). Static member lens keys are FORBIDDEN
        # while this is enabled (the planner owns every lens).
        ideation_lens_planner:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"
          timeout: 600
        ideation_selector:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"

    # Wall-clock reserves, read by benchmarks/posttrain/runner.py (not by
    # kapso core). Session deadlines carry NO shaping: ideation and
    # implementation both get the whole run budget as their deadline, and
    # the orchestrator's live clamp (what actually remains after reserves)
    # is the only bound — a single session may run the entire budget.
    session_budget:
      finalization_reserve_fraction: 0.10
      finalization_reserve_min_minutes: 5
      finalization_reserve_max_minutes: 15
      # Held OUTSIDE the orchestrator budget for the runner's finally-block
      # (final_model verify/copy) before the harness hard-kills the process.
      guard_minutes: 5

    # Iteration admission floor (core reserve gate): refuse to start an
    # iteration when less than this remains outside the finalization
    # reserve. Run #10 (R10-P2-2): with the 60s default, a doomed iteration
    # was admitted at 96.6% budget — ideation ran, the implementation got a
    # 60s slot, and its killed session stranded an eval process on the GPU
    # into the official-eval window. 30 min is the smallest slot in which a
    # train+eval cycle does useful work on this benchmark.
    budget:
      min_iteration_seconds: 1800

    # Litellm roles (repo memory, insight extraction). Rich form: the role's
    # reasoning_effort applies to every call resolved through it — these call
    # sites never plumbed an effort parameter.
    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      # The research gate is disabled; pinned anyway so a stray call can
      # never fall through to a default route.
      web_search:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      # Experiment-store semantic search: solutions embedded at write time
      # (orchestrator process, key bridged by solve.sh); the ideation
      # gate's query-side call only works where its process env carries
      # credentials — inside the container it fails loud and agents use
      # top/recent instead.
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"  # pinned: no Anthropic API key in this deployment — Claude Max OAuth only
        effort: "max"
        streaming: true
        timeout: 18000

    feedback_generator:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"  # pinned: no Anthropic API key in this deployment — Claude Max OAuth only
        effort: "max"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
