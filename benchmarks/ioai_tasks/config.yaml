# Generic local IOAI-task benchmark configuration (cross-year tasks run to
# harvest transferable learnings). Mirrors the KAGGLE mode: ensemble ideation
# + selector + lens planner + optional K-way node expansion; scored locally.

default_mode: LOCAL

# Learning-harvest agents (extract + aggregate) — run as claude_code CLI
# sessions, NOT the run-stage ensemble. Fable 5 at max reasoning, OAuth
# (the CLI reads CLAUDE_CODE_OAUTH_TOKEN from the environment itself).
harvest:
  model: "claude-fable-5"
  effort: "max"
  timeout_seconds: 2400
  allowed_tools: ["Read", "Bash", "Grep", "Glob", "Write"]

modes:
  LOCAL:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-4-8"
        implementation_model: "claude-opus-4-8"
        auth_mode: "oauth"
        gate_failure_policy: "skip"
        parent_policy: "best"
        effort: "max"
        ideation_timeout: 1500
        implementation_timeout: 7200
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        # WEB-OFF for harvest runs on PAST-contest tasks: the reference
        # solution is published online (and in-repo), so web access would leak
        # the answer. Both ensemble members are Claude (Read + MCP only, NO
        # web); the two web vectors — the lens planner (WebSearch/WebFetch) and
        # the codex member (--search) — are omitted. Two web-free members
        # (different models) keep ensemble diversity + K>1 robust (a single
        # member's occasional empty response would collapse the pool).
        ideation_ensemble:
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-opus-4-8"
            effort: "xhigh"
        ideation_selector:
          cli: "claude_code"
          model: "claude-opus-4-8"
          effort: "xhigh"
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "7200000"

    session_budget:
      ideation_fraction: 0.15
      ideation_min_seconds: 300
      implementation_fraction: 0.75
      implementation_min_seconds: 1800
      finalization_reserve_fraction: 0.10
      finalization_reserve_min_minutes: 5
      finalization_reserve_max_minutes: 15
      guard_minutes: 5

    budget:
      min_iteration_seconds: 900

    final_eval:
      timeout_seconds: 1800

    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      web_search:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 7200

    feedback_generator:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
