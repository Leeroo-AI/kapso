  rationale: 'This is a first-generation assessment with no incumbent or paired deltas,
    so the decision is accept or reject on the absolute picture, not within-noise.
    The bank shows broad foresight, and the small set of registered claims that could
    actually be settled contains no contradiction, but that accuracy is repeatedly
    described as thin because most claims were out of scope or lacked controlled,
    significance-judged evidence. Serving binds the decision across the admitted reports:
    relevant guidance was repeatedly omitted, especially the warnings that reweighting
    cannot replace representation, confirmations should be gated by decision value,
    routed state needs event-time guards, and compact tabular fallbacks deserve protection.
    Even when preventive guidance was served, boundary preflight and temporal-selection
    advice was often taken up only partially or reactively, after leakage, schema,
    cache, evaluator, or budget failures had already consumed work. At the same time,
    the survival-companion card was repeatedly served into tasks where its mechanism
    was out of scope, adding noise. With no gauntlet verdict present and no usable
    calibration table, neither supplies a separate gate or adjustment; the persistent
    delivery and uptake failures in the absolute evidence are enough to reject despite
    strong coverage and no observed settled contradiction.'
