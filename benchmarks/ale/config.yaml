# ALE-Bench Configuration
# Configuration for AtCoder Heuristic Contest algorithmic problems.
#
# Migrated to the generic strategy (stale-code audit 2026-08-26, user
# direction): agentic code-reading ideation + implementation sessions;
# the session compiles/runs the solution against the provided test cases
# itself and reports the score, and the runner's handler grades finals.
#
# Coding agents are configured in: src/kapso/execution/coding_agents/agents.yaml

# Default mode to use
default_mode: ALE_GENERIC

# Available configuration modes
modes:
  # ===========================================
  # Production Mode
  # ===========================================
  ALE_GENERIC:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-5"
        # Implementation sessions on the codex CLI (subscription login).
        implementation_model: "gpt-5.6-sol"
        implementation_cli: "codex"
        # Heuristic-contest problems benefit from algorithm literature;
        # AHC allows public references during contests.
        implementation_web: true
        auth_mode: "oauth"
        effort: "xhigh"
        gate_failure_policy: "skip"
        parent_policy: "best"
        ideation_gates: ["research", "experiment_history", "repo_memory"]
        implementation_gates: ["research", "repo_memory"]
        # Local heuristic search runs must be holdable in the foreground
        # (the CLI auto-backgrounds foreground commands at 120s otherwise).
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "7200000"
        implementation_timeout: 7200

    coding_agent:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        effort: "xhigh"
        timeout: 7200

    feedback_generator:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        effort: "xhigh"
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false

  # ===========================================
  # Quick smoke testing
  # ===========================================
  MINIMAL:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-5"
        implementation_model: "claude-opus-5"
        auth_mode: "oauth"
        effort: "medium"
        gate_failure_policy: "skip"
        parent_policy: "best"
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        ideation_timeout: 600
        implementation_timeout: 1800

    coding_agent:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true

    feedback_generator:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
