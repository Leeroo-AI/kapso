# Kaggle code-competition benchmark configuration (IOAI AI Models Track
# practice tasks).
#
# Runs on a plain single-GPU VM. Credentials in the run env:
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Max — coding agent + feedback generator)
#   - OPENAI_API_KEY           (litellm utility roles + experiment-store embeddings)
#   - ~/.kaggle/access_token   (Kaggle CLI; read by the kaggle binary itself)
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes); timeouts here are per-session ceilings which the
# runner shrinks for short runs (session_budget below).

default_mode: KAGGLE

modes:
  KAGGLE:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-4-8"
        implementation_model: "claude-opus-4-8"
        auth_mode: "oauth"
        gate_failure_policy: "skip"
        parent_policy: "best"
        effort: "max"
        ideation_timeout: 1500
        implementation_timeout: 7200
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        ideation_ensemble:
          - cli: "codex"
            model: "gpt-5.6-sol"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "xhigh"
        ideation_lens_planner:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"
          timeout: 600
        ideation_selector:
          cli: "claude_code"
          model: "claude-opus-4-8"
          effort: "xhigh"
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "7200000"

    session_budget:
      ideation_fraction: 0.15
      ideation_min_seconds: 300
      implementation_fraction: 0.75
      implementation_min_seconds: 1800
      finalization_reserve_fraction: 0.10
      finalization_reserve_min_minutes: 5
      finalization_reserve_max_minutes: 15
      guard_minutes: 5

    # Contest-mode reward economics (rendered into the handler prompt).
    # Insurance here means a SCORED Kaggle submission: kernel write + push +
    # run + submit + score poll is a ~20-min round trip, so the window is
    # wider than a local-eval task's.
    contest_economics:
      insurance_minutes: 40
      confirm_gain_ratio: 2.0
      insured_freeze_minutes: 10

    # Kaggle submission economics: the account-wide daily cap comes from the
    # competition rules; the run cap is our own budget so one campaign never
    # exhausts the day's quota.
    kaggle:
      daily_submission_cap: 5
      run_submission_cap: 3

    budget:
      min_iteration_seconds: 900
      min_iteration_seconds_insured: 300

    # Post-campaign scoring = polling the Kaggle submissions list.
    final_eval:
      timeout_seconds: 900

    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      web_search:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 7200

    feedback_generator:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
