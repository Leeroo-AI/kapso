# Kaggle code-competition benchmark configuration (IOAI AI Models Track
# practice tasks).
#
# Runs on a plain single-GPU VM. Credentials in the run env:
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Max — coding agent + feedback generator)
#   - OPENAI_API_KEY           (litellm utility roles + experiment-store embeddings)
#   - ~/.kaggle/access_token   (Kaggle CLI; read by the kaggle binary itself)
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes); timeouts here are per-session ceilings which the
# runner shrinks for short runs (session_budget below).

default_mode: KAGGLE

modes:
  KAGGLE:
    # Launch defaults for task 1 and task 2 (CLI --hours / --node-expansion
    # override these). k=8 fans out 8 implementation lanes per round; the runner
    # pins one GPU per lane (CUDA_VISIBLE_DEVICES 0..7), so k=8 assumes an
    # 8-GPU box — the hardware/lane strategy is tuned at launch, not here.
    run_defaults:
      hours: 2.0
      node_expansion: 8

    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-4-8"
        # Implementation runs on the codex CLI (gpt-5.6-sol), matching the
        # relbench RELBENCH_GENERIC codex-primary lineup. OpenAI's reasoning
        # ceiling is xhigh (no "max" tier), so the codex roles pin xhigh.
        # REQUIRES the codex coding-agent adapter (codex_agent.py + agents.yaml
        # `codex` entry + implementation_cli strategy support) — that lives on
        # feat/relbench-benchmark and is NOT in this worktree's code yet.
        implementation_model: "gpt-5.6-sol"
        implementation_cli: "codex"
        auth_mode: "oauth"
        gate_failure_policy: "skip"
        parent_policy: "best"
        effort: "xhigh"
        # Session ceilings, deliberately >= any run we launch: the real limit
        # is the run's own searchable budget (the strategy clamps every agent
        # deadline against what remains), not a per-phase slice.
        ideation_timeout: 14400
        implementation_timeout: 14400
        # Candidates each ensemble member is asked for. With 2 members this
        # pools up to 10, so the selector can still emit 8 ranked solutions for
        # K=8 when one member under-delivers or times out (the 2-per-member
        # default collapsed a k=8 run to a single lane on 2026-07-29).
        ideation_candidates_per_member: 5
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        # Three different model families generate ideas in parallel. The third
        # runs the Claude Code CLI against an Anthropic-compatible OSS endpoint
        # (auth_token_env is the VAR NAME — the secret stays out of config and
        # must reach the box's kapso/.env, see infra/bootstrap.sh).
        ideation_ensemble:
          - cli: "codex"
            model: "gpt-5.6-sol"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "xhigh"
          - cli: "oss_claude_code"
            model: "accounts/fireworks/models/kimi-k3"
            effort: "max"
            base_url: "https://api.fireworks.ai/inference"
            auth_token_env: "FIREWORKS_API_KEY"
        ideation_lens_planner:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"
          timeout: 600
        ideation_selector:
          cli: "codex"
          model: "gpt-5.6-sol"
          effort: "xhigh"
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "7200000"

    # No per-phase fractions (session ceilings are bounded by the run budget
    # alone). The finalization reserve is sized to ONE submission round trip —
    # push -> Kaggle runs the kernel -> submit -> score — because a run that
    # ends before shipping scores nothing at all: run 2 finished holding a
    # COMPLETE kernel worth 0.83626 that was never submitted. Once a public
    # score is banked the handler releases all but insured_reserve_minutes.
    session_budget:
      finalization_reserve_minutes: 20
      insured_reserve_minutes: 5
      guard_minutes: 5
      # Refuse to start a campaign with less than this left after preflight —
      # below one submission round trip nothing scoreable can finish.
      min_campaign_minutes: 25


    # Admission floor: don't start an iteration that can't finish.
    budget:
      min_iteration_seconds: 900

    # Post-campaign scoring = harvest, then poll the Kaggle submissions list.
    # The harvest submits every COMPLETE kernel the run pushed but never
    # submitted; `-v` is mandatory and the CLI exposes no version, so it probes
    # downward from harvest_max_kernel_version to find the newest that takes.
    final_eval:
      timeout_seconds: 900
      harvest_unsubmitted: true
      harvest_max_kernel_version: 12
      harvest_kernel_list_size: 50
      harvest_score_wait_seconds: 300

    # URL->run-root preflight: one session that downloads the competition
    # (authenticated kaggle CLI) and authors dataset/statement.md per
    # benchmarks/kaggle/preflight_spec.md. cli is codex or claude_code; a
    # claude_code preflight additionally needs an auth_mode key.
    preflight:
      cli: "codex"
      model: "gpt-5.6-sol"
      effort: "high"
      timeout: 1800
      web_search: true

    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      web_search:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        # codex authenticates via ~/.codex/auth.json (not oauth); OPENAI_API_KEY
        # is stripped from the child env by the adapter.
        effort: "xhigh"
        streaming: true
        timeout: 7200

    feedback_generator:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        effort: "xhigh"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
