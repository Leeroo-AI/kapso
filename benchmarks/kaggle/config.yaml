# Kaggle code-competition benchmark configuration (IOAI AI Models Track
# practice tasks).
#
# Runs on a plain single-GPU VM. Credentials in the run env:
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Max — coding agent + feedback generator)
#   - OPENAI_API_KEY           (litellm utility roles + experiment-store embeddings)
#   - ~/.kaggle/access_token   (Kaggle CLI; read by the kaggle binary itself)
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes); timeouts here are per-session ceilings which the
# runner shrinks for short runs (session_budget below).

default_mode: KAGGLE

modes:
  KAGGLE:
    # Launch defaults for task 1 and task 2 (CLI --hours / --node-expansion
    # override these). k=8 fans out 8 implementation lanes per round; the runner
    # pins one GPU per lane (CUDA_VISIBLE_DEVICES 0..7), so k=8 assumes an
    # 8-GPU box — the hardware/lane strategy is tuned at launch, not here.
    run_defaults:
      hours: 2.0
      node_expansion: 8

    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-4-8"
        # Implementation runs on the codex CLI (gpt-5.6-sol), matching the
        # relbench RELBENCH_GENERIC codex-primary lineup. OpenAI's reasoning
        # ceiling is xhigh (no "max" tier), so the codex roles pin xhigh.
        # REQUIRES the codex coding-agent adapter (codex_agent.py + agents.yaml
        # `codex` entry + implementation_cli strategy support) — that lives on
        # feat/relbench-benchmark and is NOT in this worktree's code yet.
        implementation_model: "gpt-5.6-sol"
        implementation_cli: "codex"
        auth_mode: "oauth"
        gate_failure_policy: "skip"
        parent_policy: "best"
        effort: "xhigh"
        # Session ceilings, deliberately >= any run we launch: the real limit
        # is the run's own searchable budget (the strategy clamps every agent
        # deadline against what remains), not a per-phase slice.
        ideation_timeout: 14400
        implementation_timeout: 14400
        # Candidates each ensemble member is asked for. With 2 members this
        # pools up to 10, so the selector can still emit 8 ranked solutions for
        # K=8 when one member under-delivers or times out (the 2-per-member
        # default collapsed a k=8 run to a single lane on 2026-07-29).
        ideation_candidates_per_member: 5
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        ideation_ensemble:
          - cli: "codex"
            model: "gpt-5.6-sol"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "xhigh"
        ideation_lens_planner:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"
          timeout: 600
        ideation_selector:
          cli: "codex"
          model: "gpt-5.6-sol"
          effort: "xhigh"
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "7200000"

    # Only the end-of-run reserve and guard: there are no per-phase fractions,
    # the session ceilings above are bounded by the run budget alone.
    session_budget:
      finalization_reserve_fraction: 0.10
      finalization_reserve_min_minutes: 5
      finalization_reserve_max_minutes: 15
      guard_minutes: 5


    # Admission floor: don't start an iteration that can't finish.
    budget:
      min_iteration_seconds: 900

    # Post-campaign scoring = polling the Kaggle submissions list.
    final_eval:
      timeout_seconds: 900

    # URL->run-root preflight: one codex exec that downloads the competition
    # (authenticated kaggle CLI) and authors dataset/statement.md per
    # benchmarks/kaggle/preflight_spec.md. Model/effort mirror the codex
    # coding roles (OpenAI's reasoning ceiling is xhigh, no "max" tier).
    preflight:
      model: "gpt-5.6-sol"
      effort: "xhigh"
      timeout: 1800
      web_search: true

    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      web_search:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        # codex authenticates via ~/.codex/auth.json (not oauth); OPENAI_API_KEY
        # is stripped from the child env by the adapter.
        effort: "xhigh"
        streaming: true
        timeout: 7200

    feedback_generator:
      type: "codex"
      model: "gpt-5.6-sol"
      debug_model: "gpt-5.6-sol"
      agent_specific:
        effort: "xhigh"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
