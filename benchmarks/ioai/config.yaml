# IOAI 2026 Home Task configuration
#
# Runs on a plain single-GPU VM (no container). Credentials in the run env:
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Max — coding agent + feedback generator)
#   - OPENAI_API_KEY           (litellm utility roles + experiment-store embeddings)
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes), not by this file; timeouts here are per-session
# ceilings which the runner shrinks for short runs (session_budget below).

default_mode: IOAI

modes:
  IOAI:
    search_strategy:
      type: "generic"
      params:
        # Fallback single-session model (used only if the ensemble is removed)
        # and the implementation-session model.
        idea_generation_model: "claude-opus-4-8"
        implementation_model: "claude-opus-4-8"
        auth_mode: "oauth"
        gate_failure_policy: "skip"
        parent_policy: "best"
        # max for implementation sessions (the critical-path decision lives
        # there); ensemble members/selector pin their own efforts below.
        effort: "max"
        # Ceilings; the runner's session_budget shaping shrinks these for a
        # 2h run (ideation ~18 min, implementation ~90 min).
        ideation_timeout: 1500
        implementation_timeout: 7200
        ideation_gates: ["experiment_history", "repo_memory"]
        implementation_gates: ["repo_memory"]
        # Ensemble ideation (PostTrainBench pattern): two idea-generators of
        # DIFFERENT models run in parallel over the same read-only worktree —
        # a GPT member (codex CLI) and a Claude member — each emitting
        # <solution> candidates; a Claude selector-critic then picks the best
        # single candidate to implement. Requires on the run host: the codex
        # CLI (`npm i -g @openai/codex`) and a `~/.codex/auth.json` login (the
        # codex subprocess strips OPENAI_API_KEY and authenticates via that
        # file / CODEX_API_KEY). Remove these two keys to fall back to
        # single-session ideation on idea_generation_model.
        ideation_ensemble:
          - cli: "codex"
            model: "gpt-5.6-sol"
            effort: "xhigh"
          - cli: "claude_code"
            model: "claude-fable-5"
            effort: "xhigh"
        # Task-aware lens planning: a web-enabled Fable session surveys how
        # this task's problem family is attacked and designs one lens per
        # member (once per campaign, persisted to .kapso/lens_plan.json).
        # Static member lens keys are forbidden while this is enabled.
        ideation_lens_planner:
          cli: "claude_code"
          model: "claude-fable-5"
          effort: "max"
          timeout: 600
        ideation_selector:
          cli: "claude_code"
          model: "claude-opus-4-8"
          effort: "xhigh"
        # K-way node expansion: the selector emits top-K ranked solutions and
        # each is implemented/evaluated/fed-back on its own branch in
        # parallel (barrier before the next iteration). Needs one GPU per
        # lane — pin them via expansion_lane_env. Default 1 = sequential.
        # node_expansion_value: 2
        # expansion_lane_env:
        #   - {CUDA_VISIBLE_DEVICES: "0"}
        #   - {CUDA_VISIBLE_DEVICES: "1"}
        # Optional: point the campaign shared cache at a persistent
        # task-level path to carry artifacts (e.g. the oracle answer table)
        # across campaigns; agents get them as an OPTIONAL offer with a
        # verify-before-trust contract. Default: <workspace>/.kapso/shared_cache
        # shared_cache_dir: "/home/ubuntu/ioai_shared_cache"
        # Bash-tool clock policy for agent sessions: without these the CLI
        # auto-backgrounds any foreground command at 120s.
        session_env_defaults:
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "7200000"

    # Wall-clock shaping, read by benchmarks/ioai/runner.py (posttrain
    # pattern): per-session deadlines scale with the run size so a fixed cap
    # never dominates a short run.
    session_budget:
      ideation_fraction: 0.15
      ideation_min_seconds: 300
      implementation_fraction: 0.75
      implementation_min_seconds: 1800
      finalization_reserve_fraction: 0.10
      finalization_reserve_min_minutes: 5
      finalization_reserve_max_minutes: 15
      # Held OUTSIDE the orchestrator budget for the runner's post-campaign
      # work before any external kill.
      guard_minutes: 5

    # Contest-mode reward economics, rendered verbatim into the handler's
    # Reward & time economics section (single ≤N-min insurance submission;
    # mid-run full confirms only when projected gain exceeds ratio × cost).
    contest_economics:
      insurance_minutes: 5
      confirm_gain_ratio: 2.0
      # Reserve residual once a confirmed submission is banked (the freeze
      # cost: scratch-invocation verify + atomic swap).
      insured_freeze_minutes: 4

    # Iteration admission floor: a useful improve+confirm cycle on this task
    # (tweak solver + subset eval) fits in ~15 minutes; once a confirmed
    # submission is banked (insured), a 5-minute solver tweak still pays.
    budget:
      min_iteration_seconds: 900
      min_iteration_seconds_insured: 300

    # Held-out scoring after the campaign: 500 test1 rows + 150 dev rows of
    # sequential 3B-model oracle calls — generous ceiling.
    final_eval:
      timeout_seconds: 10800

    models:
      utility:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      reasoning:
        model: "gpt-5.6-luna"
        reasoning_effort: "xhigh"
      web_search:
        model: "gpt-5.6-luna"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 5
      initial_delay_seconds: 5
      max_delay_seconds: 120
      multiplier: 2
      jitter: true

    coding_agent:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 7200

    feedback_generator:
      type: "claude_code"
      model: "claude-opus-4-8"
      debug_model: "claude-opus-4-8"
      agent_specific:
        auth_mode: "oauth"
        effort: "xhigh"
        streaming: true
        timeout: 900

    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
