# D1 corpus subset — the curated related trajectory set (orchestrator doubt D1).
#
# Selection rule (resolved 2026-08-17): task families with the densest
# multi-run history spanning >=2 datasets that share a task type — the
# churn / entity-activity binary-classification cluster — plus one sibling
# family on an unseen dataset reserved for held-out. Enumerated from the
# artifacts bucket + benchmarks/relbench/RESULTS.md on 2026-08-17.
#
# Learn side (13): churn-mechanism tasks across four datasets, with real
# same-task recurrence (rel-amazon/user-churn x3 stamps, rel-stack/
# user-engagement x4, rel-ratebeer x2+2). Held-out side (8): rel-event —
# a dataset absent from the learn side — user-repeat (all 5 stamps) and
# user-ignore (latest 3), spanning 2026-07-30 -> 2026-08-12 for the time
# axis. Excluded: rel-amazon--user-churn/20260811T203800_lane-c10-CRASH-
# partial.tgz (infra death — quarantined telemetry, mined only for
# pitfalls if ever needed). Easy extension if more learn density is
# wanted: rel-stack--user-badge (4 stamps).
#
# `role` is advisory input to the P3 split manifest (family+time rule);
# the split manifest, not this file, is the exam's authority.

