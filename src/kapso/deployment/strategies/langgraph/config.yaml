# LangGraph deployment strategy configuration
name: langgraph
provider: langsmith
interface: langgraph

# Runner class name (in runner.py)
runner_class: LangGraphRunner

# No default resources needed
default_resources: {}

requires:
  binary: langgraph
  install: "pip install langgraph-cli langgraph-sdk"

required_files: [agent.py, langgraph.json, main.py]

# Run interface configuration (passed to runner constructor)
run_interface:
  type: langgraph
  assistant_id: agent

