# BentoML deployment strategy configuration
name: bentoml
provider: bentocloud
interface: http

# Runner class name (in runner.py)
runner_class: BentoMLRunner

# Default resources for BentoCloud
default_resources:
  cpu: 2
  memory: 4Gi

requires:
  binary: bentoml
  install: "pip install bentoml"

required_files: [service.py, bentofile.yaml, deploy.py]

# Run interface configuration (passed to runner constructor); the adapter
# fills {deployment_name} from the solution path.
run_interface:
  type: bentocloud
  deployment_name: "kapso-{deployment_name}"
  predict_path: /predict

