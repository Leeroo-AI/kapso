# Docker deployment strategy configuration
name: docker
provider: null
interface: http

# Runner class name (in runner.py)
runner_class: DockerRunner

# No default resources needed (managed by Docker)
default_resources: {}

# What the machine running deploy() needs for this target; preflight and
# `kapso doctor deploy` read it.
requires:
  binary: docker
  install: "install Docker: https://docs.docker.com/get-docker/"

# Files the adapter must leave behind — the validator fails without them.
required_files: [Dockerfile, requirements.txt, app.py]

# Run interface configuration (passed to runner constructor). The adapter
# fills {deployment_name} and {port} from the solution path, so two solutions
# deployed side by side get their own image, container and host port.
run_interface:
  type: http
  endpoint: "http://localhost:{port}"
  predict_path: /predict
  container_name: "kapso-{deployment_name}"
  image_name: "kapso-{deployment_name}"
  port: "{port}"

