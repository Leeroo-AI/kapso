# Kapso's configuration: the packaged defaults.
#
# Every tunable lives here and nothing is read from the environment. Your
# own file carries only what you change and is layered over this one
# (`kapso build --config kapso-config.yaml`, `Kapso(config="kapso-config.yaml")`):
# nested mappings merge key by key, scalars and lists replace. A top-level
# key this file does not name is refused by name; `benchmark:` is reserved
# for a benchmark runner's own settings and never read by the engine.
# `kapso doctor --show-config` prints what a run will use.
#
# Credentials never live here: the coding-agent CLIs hold their own logins,
# and the keys the SDKs need (OPENAI_API_KEY for embeddings, LEEROOPEDIA_API_KEY
# for the hosted gate) are read from `.env` by the code that needs them.
#
# Design: docs/plans/redesign/wp4-config.md; the reference page:
# docs/reference/configuration.mdx.

# =============================================================================
# Hosts — the coding-agent CLIs a build may run on, and what each is asked
# for. A build's session names its host by role (search_strategy.params
# below) or inherits `params.host`; the model is the host's unless the role
# names one. The other keys are the adapter's own settings: `auth_mode` for
# Claude Code's login (oauth: the CLI's stored login; api_key: ANTHROPIC_API_KEY;
# auto: either), `effort` for the reasoning effort, `vertex_project` and
# friends for the Vertex adapter. A host must be able to serve its model: a
# Claude model on the codex CLI is refused by a ChatGPT login, and the
# preflight refuses the pair before a session runs.
# =============================================================================
hosts:
  claude_code:
    model: "claude-opus-5"
    auth_mode: "oauth"
  codex:
    model: "gpt-5.6-sol"
    effort: "xhigh"              # OpenAI's reasoning ceiling

# =============================================================================
# Inference — every non-embedding completion runs through the configured
# coding agent. The default is a CLI session (docs/research/
# cli-only-inference-design.md); `openai_compatible` is an explicit direct-API
# option. Roles inherit `default`; entries override. Embeddings stay on the
# API path under each mode's models.embedding.
# =============================================================================
inference:
  default:
    cli: codex
    model: "gpt-5.6-sol"
    effort: "xhigh"
    sandbox: "read-only"          # inference sessions never write
    timeout_seconds: 900
    web_search: false
    # The adapter's own settings for every inference session (an
    # openai_compatible endpoint's base_url and api_key_env, say); a
    # role's agent_specific merges over it.
    agent_specific: {}
  roles:
    # Web research — codex --search carries the live-web tool.
    research: {web_search: true, timeout_seconds: 1800}
    # Retrieval loops — mechanical calls, low effort keeps latency sane.
    kg_rerank: {effort: "low", timeout_seconds: 300}
    kg_navigate: {effort: "low", timeout_seconds: 300}
    repo_memory: {}
    commit_message: {effort: "low", timeout_seconds: 180}
    # Benchmark handlers' utility calls (output/problem-statement cleanup).
    benchmark_utility: {effort: "low", timeout_seconds: 600}

# =============================================================================
# Preflight — every verb checks what THIS config needs before doing work
# (core/preflight.py). Requirements are derived from the config, so an
# all-codex setup is never asked for `claude` and a local codify target is
# never asked for `gcloud`. Same rows behind `kapso doctor [verb]`.
# =============================================================================
preflight:
  # The static tier: binaries, credentials, backend ports, the bank's git
  # remote. Milliseconds, and it turns a four-hour failure into a
  # four-second one (onboarding E2E findings #1 and #5).
  enabled: true
  # The live tier: one throwaway token per {cli, model} pair, proving the
  # account can actually serve it. Off by default because it spends real
  # quota on every call; worth turning on for long unattended runs, where
  # seconds up front beat hours lost to a model the login cannot serve.
  # (A usage cap on a model it can serve is invisible to a one-token probe.)
  live_model_probe: false

# =============================================================================
# Hosted MCP gates — where the gate registry (gated_mcp/presets.py) points
# sessions. Bundled gates run in-process and need no address.
# =============================================================================
gates:
  leeroopedia:
    # Leeroopedia's hosted MCP server (streamable HTTP; nothing to install).
    # The server reads the key from the query string, so the placeholder is
    # filled from LEEROOPEDIA_API_KEY when a session launches — the key
    # never enters this file or the campaign tree.
    url: "https://mcp.leeroopedia.com/mcp?token={LEEROOPEDIA_API_KEY}"
    # The agentic tools (build_plan, verify_code_math, ...) take 45-180s on
    # the server; both CLIs cut an MCP tool call at 60s unless told
    # otherwise (live, 2026-10-02: the two slowest tools timed out at 60.0s).
    tool_timeout_seconds: 600

# =============================================================================
# Deployment (docs/plans/redesign/wp5-deploy.md) — the session deploy()
# runs on a copy of the solution, a spec over the hosts table like the
# build's roles, plus the target it deploys to when the call names none,
# the deadlines, and the host ports a deployment takes.
# =============================================================================
deployment:
  target: auto         # what deploy() targets when the call names none: auto, a bundled target (local, docker, modal, bentoml, langgraph) or a harness's
  cli: null            # the host the deployment session runs on, an entry of hosts; null follows search_strategy.params.host
  model: null          # the host entry's when null
  effort: null
  timeout: 1800        # the deployment session's deadline, seconds, its one resume included
  call_timeout: 300    # one run() call of the deployed software, seconds
  script_timeout: 600  # one lifecycle script of its target (start, stop, health, logs), seconds
  port_base: 8000      # the host ports a deployment takes: port_base + (hash + number) % port_span, the first free
  port_span: 1000

# =============================================================================
# Harness — the domain layer a build loads (docs/research/harness-design.md).
# Nothing here names a harness: what a run loads is said at the call, on
# the command line, or in the brief.
# =============================================================================
harness:
  store: ~/.kapso/harnesses          # fetched git references, one directory per <slug>@<rev>
  page_warning_lines: 40             # `check` warns on an always-on page longer than this
  setup_minutes: 20                  # the harness setup session's timeout, clamped by the budget
  verification_minutes: 10           # each verification session's timeout, clamped by the budget
  verification_attempts: 2           # sessions run for one attempt before it is recorded unverified
  server_tool_timeout_seconds: 600   # a harness server's per-call timeout where the host takes one (Codex)

# The experience homes (docs/plans/redesign/wp3-experience.md). Your own
# bank is learning.bank.local_path; the hosted gate is gates.leeroopedia.
experience:
  banks: ~/.kapso/experience/banks      # banks you read, one clone per <slug>@<rev> with a fetch record beside
  indexes: ~/.kapso/experience/indexes  # corpora you ingested with `kapso experience add --name <n>`, one directory each
  # `kapso experience add --research "<question>"`: the modes the web
  # search answers in (idea, implementation, study) and its depth (light,
  # deep); the findings are ingested as they come.
  research_modes: [idea, implementation]
  research_depth: deep
  # What a host session (`kapso-mcp`, the plugin's server) is served when
  # `--experience` is absent: references in the grammar `kapso experience
  # list` shows (mine, mine:all, a bank path or git reference, an index
  # name). A listed source that does not exist leaves its gate off, named
  # in the server's instructions; `kapso learn` offers `[mine:all]`.
  session_sources: []

# =============================================================================
# The build's search: the generic strategy and its parameters. Three roles
# name the build's sessions — ideation, implementation (the verification,
# the harness setup and the difficulties reconstruction sessions follow it)
# and the judge — each with `cli`, `model`, `effort` and `timeout` (seconds;
# absent means no deadline beyond the budget's clamp), the host's values
# where the role says nothing. `kapso build --coding-agent <cli>` sets
# `host` for the campaign. A parameter this block does not name is refused
# by name.
# =============================================================================
search_strategy:
  type: "generic"
  params:
    host: "claude_code"
    ideation:
      # The role's own host, model, effort and deadline (seconds); null
      # takes the host's (`host` above and its entry in `hosts`), and no
      # deadline beyond the budget's clamp.
      cli: null
      model: null
      effort: null
      timeout: null
      # The bundled MCP gates the session mounts: research (web), the
      # experiment history (past attempts) and the repo memory; a loaded
      # bank or index mounts its own gate when it is loaded.
      gates: ["research", "experiment_history", "repo_memory"]
      # The native web tools (Claude Code's WebSearch and WebFetch, Codex's
      # --search): the engine's permission boundary, which the selector
      # and the lens planner follow. A harness whose protocol forbids the
      # web on a module lists a hook there as well.
      web: true
      # Candidates each member is asked for; with one member and one
      # candidate no selector runs.
      candidates_per_member: 1
      # Parallel members [{cli, model?, effort?, lens?}, …] pooled by a
      # selector {cli, model?, effort?}; a lens_planner {cli, model?,
      # effort?, timeout} designs each member's lens per iteration and
      # names the design axes the judge reports on; ensemble_time_split
      # {member_fraction, selector_fraction, selector_min_seconds?} carves
      # the ideation clamp between the members and the selector (absent:
      # each role takes the whole clamp).
      ensemble: null
      selector: null
      lens_planner: null
      ensemble_time_split: null
    implementation:
      cli: null
      model: null
      effort: null
      timeout: null
      gates: ["research", "repo_memory"]
      web: true
      # A second model tried once when the session crashes (a provider's
      # safety kill); null retries nothing.
      fallback_model: null
    # The feedback session that judges every attempt.
    judge:
      cli: null
      model: null
      effort: null
      timeout: null
    # A gate the machine cannot serve: skip it, warn and go on, or error.
    gate_failure_policy: "warn"
    # Whether the judge's stop vote ends the campaign: true for a task with a
    # goal to reach; false for open-ended maximisation (a contest has no
    # "achieved", so the vote is advisory and the budget is the only clock).
    honor_agent_stop: true
    # The branch a new attempt starts from: best (the champion) or baseline.
    parent_policy: "best"
    # Behind `parent_policy: weighted`: lower temperature moves toward
    # `best`, higher toward uniform; the offspring penalty down-weights
    # parents that were already expanded; the seed makes a resume draw
    # the parent it would have drawn uninterrupted.
    parent_sampling:
      temperature: 1.0
      offspring_penalty: 1.0
      seed: 0
    # Parallel implementation lanes per iteration (the selector ranks that
    # many candidates); expansion_lane_env pins each lane's environment,
    # one {VAR: value} mapping per lane.
    node_expansion_value: 1
    expansion_lane_env: null
    # Environment variables stripped from every session (credential
    # containment), and set-if-absent defaults for every session.
    env_strip: []
    session_env_defaults: {}
    # A campaign-level cache the sessions share (null: under the campaign).
    shared_cache_dir: null
    # Where a registered evaluation's archived runs are recovered from
    # (a glob of run archive parents); null recovers nothing.
    registered_evaluation_archive_glob: null
    # The repo memory's failure policy (warn or fail) and its retries.
    repo_memory_failure_policy: "warn"
    repo_memory_max_retries: 1
    # Characters of line-numbered changed-file text one repo-memory update
    # call carries; past it the update is windowed into several calls of
    # whole files, so an experiment that commits large files still gets a
    # memory update instead of a prompt past the model's context window.
    repo_memory_update_payload_max_chars: 400000
    # Platform execution cost, separate from model spend in USD.
    cost:
      enabled: false
      estimator: null
      cap_per_candidate: null
      campaign_budget: null
      unit: "credits"
      weight: 0.0

# Knowledge search over an ingested corpus: how an index (`kapso experience
# add --repo|--research`) is built and searched. The model and collection
# details are knowledge_search.yaml presets; a build searches the index it
# loads (`--experience <name>`).
knowledge_search:
  type: "kg_graph_search"
  preset: "DEFAULT"
  # The store's own parameters over the preset's (weaviate_url,
  # embedding_base_url, …): an open namespace, empty by default.
  params: {}

# The ingest's two sessions (`kapso experience add --repo|--research`).
# `effort` is pinned so a session never inherits the machine's own Claude
# settings; `timeout: null` means no deadline.
learner:
  ingestor:
    # The coding agent that runs the sessions: claude_code (first-party
    # login), or vertex_claude_code for a Vertex AI open model, which
    # takes its settings from agent_specific (vertex_project, ...).
    cli: "claude_code"
    agent_specific: {}
    model: "claude-opus-5-5"
    auth_mode: "oauth"
    effort: "xhigh"
    timeout: null
    cleanup: true
    cleanup_staging: false
    fail_on_validation_errors: true
    # Publish each extracted Workflow as a runnable GitHub repository
    # (after validation; `gh` reads GH_TOKEN). Off by default: a run then
    # produces pages only, and Workflow pages keep a placeholder URL.
    publish_workflows: false
    github_repo_visibility: "private"
  merger:
    cli: "claude_code"
    agent_specific: {}
    model: "claude-opus-5-5"
    auth_mode: "oauth"
    effort: "xhigh"
    timeout: null

# Bounded exponential backoff for transient model failures, and the hard
# per-request wall clock handed to the provider client (without it a
# connection the server abandons mid-stream blocks the calling thread
# forever).
retry:
  max_attempts: 2
  initial_delay_seconds: 5
  max_delay_seconds: 60
  multiplier: 2
  jitter: true
  request_timeout_seconds: 600

models:
  # Semantic search over past experiments (`search_similar_experiments`
  # and the ideation gate's similarity lookup) embeds every node's
  # solution with this model through OPENAI_API_KEY. Null turns it off:
  # the experiment store is recency-only and no OpenAI key is needed.
  # Turn it on with an OpenAI embedding model, e.g. "text-embedding-3-small".
  embedding: null

# =============================================================================
# The budget, in the words of the brief's Budget line and the build's flags:
# the brief's values win over these, a call's over the brief's.
# =============================================================================
budget:
  # Experiments the campaign may run when neither the brief nor the call
  # names a cap.
  experiments: 10
  # The wall clock in minutes (null: unbounded) and the model spend in USD
  # (null: unbounded, best effort).
  minutes: null
  usd: null
  # Kept out of the search for finishing: the last attempt's evaluation,
  # verification and judgment run inside it, and the delivery after them.
  # Null derives it each round from those obligations (the harness's
  # verification minutes, the judge's observed duration, the delivery's
  # protected slice); a number wins; either is bounded by a quarter of
  # the budget, so a short budget keeps its search.
  reserve_minutes: null
  # A round is admitted when the searchable remainder covers the larger
  # of this floor (seconds) and the previous round's own duration.
  min_iteration_seconds: 60
  # Below this an agent session cannot do useful work: a session whose
  # deadline would be clamped to it is not launched.
  min_agent_timeout_seconds: 60
  # What the judge is kept, in seconds, before one has been observed in
  # the campaign (a judge takes minutes): the round's reserve for it and
  # the obligation the evaluation and the verification leave standing, so
  # a first attempt's verification cannot run the remainder down to the
  # floor and lose the attempt unjudged. A judge that has been observed
  # is kept its own last duration.
  judge_reserve_seconds: 300
  # Durable-clock + status heartbeat interval. Feeds the orchestrator's
  # checkpoint heartbeat daemon (elapsed_seconds stays fresh between
  # boundary checkpoints) and the observability layer's liveness signal:
  # a status file whose heartbeat is 3 intervals stale renders STALLED.
  checkpoint_heartbeat_seconds: 60
  # `kapso build --output <campaign> --stop`: how long the campaign's
  # processes get after SIGTERM before SIGKILL ends them.
  stop_grace_seconds: 10
  # How often the stop looks whether they are gone, while it waits.
  stop_poll_seconds: 0.1
  # Budget-aware fidelity (docs/evolve/budget-aware-experimentation.mdx):
  # fast-fidelity probes under a committed full-size run, with the
  # evaluation maintainer's timing model. `off` runs every attempt at full
  # fidelity; `on` or `auto` need the maintainer enabled.
  fidelity:
    mode: "off"
    # The fraction of the budget escrowed for the committed full-size run.
    committed_run_fraction: 0.45
    # Full runs the search affords before probes pay; the margin a probe
    # must clear to be promoted; the caps on full runs and full
    # evaluations; the calibration pairs the timing model needs; whether
    # the endgame validates the champion at full fidelity.
    min_affordable_full_runs: 4
    promotion_margin: 0.02
    max_full_runs: 2
    max_full_evals: 3
    calibration_min_pairs: 3
    endgame_validate: true
    # The fast fractions: the build's (null: no fast build dial) and the
    # evaluation's.
    build:
      fast_fraction: null
    eval:
      fast_fraction: 0.15

# The campaign inbox (docs/research/evolve-hub-design.md v4): a session
# that needs something only a person can provide asks through the
# request_from_user tool and is stopped; the campaign pauses and exits;
# `kapso inbox reply` resumes it and continues the very session.
inbox:
  # Off means no session gets the tool and nothing ever pauses.
  enabled: true
  # After request_from_user returns, how long the session gets to end
  # its own turn before the adapter ends it.
  stop_grace_seconds: 120
  # One line per launched campaign, so `kapso inbox` with no campaign
  # can list every campaign waiting on a person.
  registry: "~/.kapso/campaigns.jsonl"

# `kapso report`: how many top candidates the leaderboard and its diff
# section list; --top overrides it for one run.
report:
  leaderboard_size: 5

# The evaluation maintainer: its own sessions calibrate and register the
# evaluator a build measures with, and protect it file by file
# (docs/evolve/evaluation-integrity.mdx). Off by default: `enabled: true`
# turns it on, its session on the build's host unless cli, model, effort
# or timeout say otherwise.
evaluation_maintainer:
  enabled: false
  cli: null
  model: null
  effort: null
  timeout: null
  # The fast-fidelity calibration run: its subsample seed and fraction,
  # its timeout, and the full-run threshold above which a fast variant is
  # registered at all; the overhead factor pads the timing model.
  subsample_seed: 1337
  calibration_fraction: 0.03
  calibration_timeout_seconds: 900
  fast_variant_threshold_minutes: 20
  overhead_factor: 1.25
  # Evaluator change requests a campaign may file, and the fraction of the
  # time budget past which they are deferred (a ruler change near the
  # deadline orphans the final selection).
  max_change_requests: 3
  transition_freeze_fraction: 0.85
  # Data paths the maintainer protects beside the evaluator.
  protected_data_paths: []

# =============================================================================
# Learning — the learn-from-trajectories system
# Design: docs/research/learn-from-trajectories-design.md; build plan:
# docs/plans/learning/orchestrator.md. Keys land phase by phase; this file is
# the single source for every learning knob (Rule 1).
# =============================================================================
learning:
  trajectory_store:
    # Identity-addressed campaign bundles (design §3.4). `local` is the
    # cache-through mirror and, until `remote` is configured (P5 per doubt
    # D2), the whole store. Kapso's own state lives under ~/.kapso, not
    # under the project it is run from: a store at data/trajectories sat
    # inside the directory users pass as --data-dir and rode into every
    # campaign's kapso_datasets/ and seed commit. Relative paths resolve
    # against the CWD.
    local: ~/.kapso/trajectories
    remote: null
  # Import reports land under the run-dir home (doubt D6: repo-root
  # `learning/`, gitignored, synced to the artifacts bucket).
  import_report_dir: learning/imports
  # Status files for learn / experience (observability design §1);
  # a build's lives with its workspace at W/.kapso/status.json. Watch any
  # of them with `kapso watch <path>`.
  status_dir: learning/status
  harvest:
    # Campaign drivers save finished campaigns into the store under the
    # strict contract (P1.G — the build->learn bridge). Store stays
    # local-only until `trajectory_store.remote` is set (doubt D2).
    enabled: true
  mining:
    # The mining crew (design §4.2; prompts in learning/crews/mining/).
    # Claude-led structurally — self-organization needs the CLI's native
    # subagents (doubt D4); flow-writer/critic run as native Task subagents
    # inside the lead session, so their models are Claude models.
    lead:
      cli: claude_code
      model: "claude-fable-5"
      effort: "xhigh"
      auth_mode: "oauth"
    flow_writer_model: "claude-fable-5"
    critic_model: "claude-fable-5"
    timeout_minutes: 240
    repair_rounds: 1
    # A lead turn the model's safeguards refused is launched again this
    # many times (a fresh session, the same prompt) before the lesson
    # fails; the learn status notes each relaunch.
    refusal_relaunches: 1
    # A mining run's own directory, `<run_root>/<trajectory>/`: the lead's
    # harness staging record and stream (`.kapso/sessions/lead/`) when the
    # lesson runs with a harness. The mined view itself lives in the bundle.
    run_root: learning/mining
  retriever:
    # Serving v2 (serving-agentic-redesign.md): no selection knobs — the
    # index carries the whole eligible set and the reading agent selects.
    # Probe offers riding card reads per campaign — a hard cap, so learning
    # never cannibalizes doing.
    probe_budget: 1
  graders:
    # Scoring semantics (grader-scoring doc §5): corridor half-width, the
    # accuracy settlement floor, calibration pooling minimum and buckets.
    score_band: 0.20
    min_settlements: 2
    calibration_min: 20
    calibration_buckets: [0.4, 0.7]
    gauntlet:
      stability_tolerance: 0.10
    # The grader roles (scoring doc §6; doubt D4): report-writer + assessor on
    # codex/GPT-5.6 xhigh; the verifier cross-model on Claude — the diversity
    # is part of the check. Per-role {cli, model, effort} so the all-Claude
    # switch is one config change.
    crew:
      report_writer: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
      verifier: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
      assessor: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
      # Five rounds: mechanical + semantic + recomputation cascade (arm-T,
      # 32 discoveries) + headroom for the adversarial whack-a-mole regime
      # — on large surfaces (35 discoveries x 5 views, clean-room ingest 3)
      # each repaired pass lets the verifier surface genuinely new lazy
      # NOVELs; capacity must exceed the verifier's findable set.
      repair_rounds: 5
      timeout_minutes: 90
    # Grader run dirs (doubt D6: repo-root learning/, gitignored).
    run_root: learning/graders
  bank:
    # The bank home (design §3.1): a local bare repo, created automatically
    # on first learn(). Every update run clones this home, edits, and pushes
    # back — single writer per bank. Sharing is git-native: the home's own
    # `origin` remote (attached via `kapso experience share <url>`) is the push
    # target; no origin means learn() stays local-only. There is no remote
    # key here — a bank carries its remote itself, like any git repo. One
    # bank per user, under ~/.kapso like the trajectory store: at
    # data/kapso-bank.git it was copied into campaigns with --data-dir data.
    local_path: ~/.kapso/bank.git
  serving:
    # What is loaded is what is served (docs/plans/redesign/wp3-experience.md):
    # a build with experience loaded pins each bank, rides the intro after
    # the static context notes, and gives ideation/implementation sessions
    # the three bank tools — bank_index / bank_get_card /
    # bank_get_card_with_evidence (the feedback judge never gets them).
    # Where a host session's serving is staged (its pinned bank checkouts,
    # serving record and pull log), one directory per kapso-mcp process.
    # A campaign stages into its own work dir instead.
    session_root: ~/.kapso/serving
  update_crew:
    # The update crew (design §4.3; update-crew doc): Claude lead (structural
    # — self-organization + native critic subagent), codex GPT-5.6 xhigh
    # workers driven via run-role.sh (doubt D4), cross-model critic.
    # The crew version Kapso.learn() uses when its learner_version kwarg is
    # omitted (learn-api-design.md §6); the CLI keeps --learner-version.
    default_version: crew_v4
    lead: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    worker: {model: "gpt-5.6-sol", effort: "xhigh"}
    critic: {model: "claude-fable-5"}
    # Three rounds: mechanical-class + semantic-class + one for large
    # served-exam lessons (clean-room ingest 3, live: ref repairs and
    # weaken-admission fixes did not converge in two).
    repair_rounds: 3
    # A cap, not a duration — crews that finish early pay nothing. 240 was
    # calibrated on fable-5 single-trajectory dockets; the onboarding E2E
    # (2026-08-27) measured 231 min on an opus-5 swap — a 9-minute margin —
    # so 360 covers model swaps and small dockets (findings doc #6).
    timeout_minutes: 360
    # Inclusive docket nomination threshold — similarity nominates, mechanism
    # decides (a false nomination costs minutes of review, never correctness).
    dup_nominate_jaccard: 0.5
    # Reader-contract migration pace: non-conforming card bodies rewritten
    # per lesson run, highest reliability first (~20% of the founding bank;
    # fast-iteration decision 2026-08-21).
    rewrite_rows_per_run: 4
    # Substance floors per card-template element (words) — thin elements
    # count as non-conforming and re-queue for rewrite (user feedback
    # 2026-08-21: a length cap produced unusably thin bodies; floors, not
    # caps).
    body_floors: {rule: 35, section: 25, confidence: 8}
    sightings_expiry_batches: 6
    run_root: learning/runs
  ab:
    # The A/B gate (grader-scoring §2.5): candidate-head vs incumbent-head
    # arms on same-task pairs. Waivable — not-run is recorded as not-run,
    # never as passed; when required, within-noise BLOCKS promotion.
    required: false
    pairs: 5
  codify:
    # The procedure code path (codify doc §7). min_recurrence gates the
    # seeder's layer-1 nomination; the run knobs govern the codify driver
    # (a build minus ideation) and the freshness clock.
    min_recurrence: 2
    max_iterations: 3
    iteration_timeout_minutes: 60
    target: gcp_ephemeral   # D8: the dev box is not a run host; `local` for harness tests
    machine_type: g2-standard-8   # the gpu-class default for gpu preconditions
    replay_max_age_days: 60
    tolerance_z: 2
    # The run's two sessions (D4: implementor on the default intelligence,
    # the claims judge cross-model).
    implementor: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
    judge: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    gcp:
      # Your own GCP project. Deliberately empty: this file ships inside the
      # published package, so it must not carry one organisation's project id.
      # Set it in your own config and pass that with --config / config_path.
      # gcp_ephemeral refuses to provision anything while this is blank.
      project: ""
      zone: us-central1-a
      cpu_machine_type: e2-standard-8
      accelerator: type=nvidia-l4,count=1
      # The DLVM CPU families were retired; the cu129 ubuntu family boots
      # fine on CPU-only machines and carries /opt/conda.
      image_family: common-cu129-ubuntu-2204-nvidia-580
      image_project: deeplearning-platform-release
      boot_disk_gb: "200"
      # Prefixed to the evaluation command on the instance: env activation and
      # any dependency the DLVM image lacks. Empty by default because what
      # belongs here is per-benchmark, not general. For RelBench, for example:
      #   "/opt/conda/bin/pip install --quiet relbench==2.1.2 && PATH=/opt/conda/bin:$PATH"
      bootstrap: ""
  develop:
    # The development regime (design §4.4): disposable banks, chronological
    # exam-then-ingest replay of the learn set, keep-best banking of learner
    # versions.
    batch_size: 3
    run_root: learning/develop
    versions_ledger: learning/versions.yaml
  behavior:
    # The semantic production suite (behavior-tests.md): real machinery on
    # known-truth fixtures, judged by a cross-model reviewer; FAIL gates
    # promotion like a gauntlet trap. Fixtures land with their phases.
    scenarios_dir: benchmarks/relbench/data/learning_behavior
    reviewer: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    timeout_minutes: 60
    run_root: learning/behavior
