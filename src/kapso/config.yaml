# Generic Problem Runner Configuration
# Configuration for solving arbitrary problems
#
# Usage:
#   kapso evolve --goal "Your problem..." --mode GENERIC
#
# Available Search Strategies:
#   - generic: Claude Code + MCP gates for ideation and implementation
#
# Knowledge Search Backends (via KnowledgeSearchFactory):
#   - kg_graph_search: Weaviate embeddings + Neo4j graph (for wiki pages)
#   - kg_llm_navigation: Neo4j KG with LLM-guided navigation (for JSON KG)
#
# Experiment History:
#   - Stored in .kapso/experiment_history.json
#   - Accessed via MCP tools (get_top_experiments, get_recent_experiments, search_similar_experiments)
#   - Optionally indexed in Weaviate for semantic search (set WEAVIATE_URL env var)

# Default mode to use
default_mode: GENERIC

# =============================================================================
# Inference — every non-embedding completion runs as a coding-agent CLI
# session (docs/research/cli-only-inference-design.md; user decisions
# 2026-08-25: convert all, default codex/gpt-5.6-sol/xhigh, fail loud with
# no API fallback). Roles inherit `default`; entries override. Embeddings
# stay on the API path under each mode's models.embedding.
# =============================================================================
inference:
  default:
    cli: codex
    model: "gpt-5.6-sol"
    effort: "xhigh"
    sandbox: "read-only"          # inference sessions never write
    timeout_seconds: 900
  roles:
    # Web research — codex --search carries the live-web tool.
    research: {web_search: true, timeout_seconds: 1800}
    # Retrieval loops — mechanical calls, low effort keeps latency sane.
    kg_rerank: {effort: "low", timeout_seconds: 300}
    kg_navigate: {effort: "low", timeout_seconds: 300}
    repo_memory: {}
    commit_message: {effort: "low", timeout_seconds: 180}
    # Benchmark handlers' utility calls (output/problem-statement cleanup).
    benchmark_utility: {effort: "low", timeout_seconds: 600}

# =============================================================================
# Preflight — every verb checks what THIS config needs before doing work
# (core/preflight.py). Requirements are derived from the config, so an
# all-codex setup is never asked for `claude` and a local codify target is
# never asked for `gcloud`. Same rows behind `kapso doctor [verb]`.
# =============================================================================
preflight:
  # The static tier: binaries, credentials, backend ports, the bank's git
  # remote. Milliseconds, and it turns a four-hour failure into a
  # four-second one (onboarding E2E findings #1 and #5).
  enabled: true
  # The live tier: one throwaway token per {cli, model} pair, proving the
  # account can actually serve it. Off by default because it spends real
  # quota on every call; worth turning on for long unattended runs, where
  # seconds up front beat hours lost to a capped model.
  live_model_probe: false

# =============================================================================
# Platform defaults — the base layer under every mode of every config file
# =============================================================================
# load_mode_config() resolves a mode as deep_merge(defaults, modes[<mode>]):
# nested dicts merge key-by-key; scalars and lists replace wholesale. A key
# here is inherited by any mode (platform or benchmark) that does not
# override it — keep this layer to values that are correct for every
# deployment; anything modes legitimately differ on stays per-mode.
defaults:
  models:
    # Embeddings route (experiment-store semantic search, knowledge search).
    embedding: "text-embedding-3-small"
  budget:
    # Durable-clock + status heartbeat interval. Feeds the orchestrator's
    # checkpoint heartbeat daemon (elapsed_seconds stays fresh between
    # boundary checkpoints) and the observability layer's liveness signal:
    # a status file whose heartbeat is 3 intervals stale renders STALLED.
    checkpoint_heartbeat_seconds: 60
  retry:
    # Hard per-request wall clock handed to the provider client. Without it
    # a connection the server abandons mid-stream blocks the calling thread
    # forever (first live wedge: rel-event/user-ignore re-run, 2026-08-09).
    request_timeout_seconds: 600

# =============================================================================
# Available configuration modes
# =============================================================================
modes:
  # ===========================================
  # Production Mode
  # ===========================================
  
  # Standard configuration for generic problems
  # Uses Claude Code with MCP gates for ideation and implementation
  GENERIC:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-5"
        implementation_model: "claude-opus-5"
        auth_mode: "oauth"
        gate_failure_policy: "warn"
        ideation_gates: ["research", "experiment_history", "repo_memory", "leeroopedia"]
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true
    
    feedback_generator:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true
    
    # Knowledge search configuration
    # All model/collection details are in knowledge_search.yaml presets.
    # Use index_kg() to index data, then pass kg_index to Kapso.
    knowledge_search:
      type: "kg_graph_search"
      enabled: true
      preset: "DEFAULT"
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "claude-opus-5"
        auth_mode: "oauth"
        timeout: 1800
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "claude-opus-5"
        auth_mode: "oauth"
        timeout: 3600

  # ===========================================
  # Testing Modes
  # ===========================================
  
  # Minimal configuration for quick testing
  MINIMAL:
    search_strategy:
      type: "generic"
      params:
        idea_generation_model: "claude-opus-5"
        implementation_model: "claude-opus-5"
        auth_mode: "oauth"
        gate_failure_policy: "warn"
        ideation_gates: ["research", "experiment_history", "repo_memory", "leeroopedia"]
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true
    
    feedback_generator:
      type: "claude_code"
      model: "claude-opus-5"
      debug_model: "claude-opus-5"
      agent_specific:
        auth_mode: "oauth"
        streaming: true
    
    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "claude-opus-5"
        auth_mode: "oauth"
        timeout: 600
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "claude-opus-5"
        auth_mode: "oauth"
        timeout: 1800

# =============================================================================
# Learning — the learn-from-trajectories system
# Design: docs/research/learn-from-trajectories-design.md; build plan:
# docs/plans/learning/orchestrator.md. Keys land phase by phase; this file is
# the single source for every learning knob (Rule 1).
# =============================================================================
learning:
  trajectory_store:
    # Identity-addressed campaign bundles (design §3.4). `local` is the
    # cache-through mirror and, until `remote` is configured (P5 per doubt
    # D2), the whole store. Relative paths resolve against the CWD; the
    # shipped default assumes repo-root invocation.
    local: data/trajectories
    remote: null
  # Import reports land under the run-dir home (doubt D6: repo-root
  # `learning/`, gitignored, synced to the artifacts bucket).
  import_report_dir: learning/imports
  # Status files for learn / learn_knowledge (observability design §1);
  # evolve's lives with its workspace at W/.kapso/status.json. Watch any
  # of them with `kapso watch <path>`.
  status_dir: learning/status
  harvest:
    # Campaign drivers save finished campaigns into the store under the
    # strict contract (P1.G — the evolve->learn bridge). Store stays
    # local-only until `trajectory_store.remote` is set (doubt D2).
    enabled: true
  mining:
    # The mining crew (design §4.2; prompts in learning/crews/mining/).
    # Claude-led structurally — self-organization needs the CLI's native
    # subagents (doubt D4); flow-writer/critic run as native Task subagents
    # inside the lead session, so their models are Claude models.
    lead:
      cli: claude_code
      model: "claude-fable-5"
      effort: "xhigh"
      auth_mode: "oauth"
    flow_writer_model: "claude-fable-5"
    critic_model: "claude-fable-5"
    timeout_minutes: 240
    repair_rounds: 1
  retriever:
    # Serving v2 (serving-agentic-redesign.md): no selection knobs — the
    # index carries the whole eligible set and the reading agent selects.
    # Probe offers riding card reads per campaign — a hard cap, so learning
    # never cannibalizes doing.
    probe_budget: 1
  graders:
    # Scoring semantics (grader-scoring doc §5): corridor half-width, the
    # accuracy settlement floor, calibration pooling minimum and buckets.
    score_band: 0.20
    min_settlements: 2
    calibration_min: 20
    calibration_buckets: [0.4, 0.7]
    gauntlet:
      stability_tolerance: 0.10
    # The grader roles (scoring doc §6; doubt D4): report-writer + assessor on
    # codex/GPT-5.6 xhigh; the verifier cross-model on Claude — the diversity
    # is part of the check. Per-role {cli, model, effort} so the all-Claude
    # switch is one config change.
    crew:
      report_writer: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
      verifier: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
      assessor: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
      # Five rounds: mechanical + semantic + recomputation cascade (arm-T,
      # 32 discoveries) + headroom for the adversarial whack-a-mole regime
      # — on large surfaces (35 discoveries x 5 views, clean-room ingest 3)
      # each repaired pass lets the verifier surface genuinely new lazy
      # NOVELs; capacity must exceed the verifier's findable set.
      repair_rounds: 5
      timeout_minutes: 90
    # Grader run dirs (doubt D6: repo-root learning/, gitignored).
    run_root: learning/graders
  bank:
    # The bank home (design §3.1): a local bare repo, created automatically
    # on first learn(). Every update run clones this home, edits, and pushes
    # back — single writer per bank. Sharing is git-native: the home's own
    # `origin` remote (attached via `kapso bank connect <url>`) is the push
    # target; no origin means learn() stays local-only. There is no remote
    # key here — a bank carries its remote itself, like any git repo.
    local_path: data/kapso-bank.git
  serving:
    # Serving v2 (serving-agentic-redesign.md): when enabled, campaign
    # launches pin the bank, the knowledge intro rides after the static
    # context notes, and ideation/implementation sessions get the three
    # bank tools — bank_index / bank_get_card / bank_get_card_with_evidence
    # (the feedback judge never does). Per-benchmark off-switch.
    enabled: false
  update_crew:
    # The update crew (design §4.3; update-crew doc): Claude lead (structural
    # — self-organization + native critic subagent), codex GPT-5.6 xhigh
    # workers driven via run-role.sh (doubt D4), cross-model critic.
    # The crew version Kapso.learn() uses when its learner_version kwarg is
    # omitted (learn-api-design.md §6); the CLI keeps --learner-version.
    default_version: crew_v4
    lead: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    worker: {model: "gpt-5.6-sol", effort: "xhigh"}
    critic: {model: "claude-fable-5"}
    # Three rounds: mechanical-class + semantic-class + one for large
    # served-exam lessons (clean-room ingest 3, live: ref repairs and
    # weaken-admission fixes did not converge in two).
    repair_rounds: 3
    # A cap, not a duration — crews that finish early pay nothing. 240 was
    # calibrated on fable-5 single-trajectory dockets; the onboarding E2E
    # (2026-08-27) measured 231 min on an opus-5 swap — a 9-minute margin —
    # so 360 covers model swaps and small dockets (findings doc #6).
    timeout_minutes: 360
    # Inclusive docket nomination threshold — similarity nominates, mechanism
    # decides (a false nomination costs minutes of review, never correctness).
    dup_nominate_jaccard: 0.5
    # Reader-contract migration pace: non-conforming card bodies rewritten
    # per lesson run, highest reliability first (~20% of the founding bank;
    # fast-iteration decision 2026-08-21).
    rewrite_rows_per_run: 4
    # Substance floors per card-template element (words) — thin elements
    # count as non-conforming and re-queue for rewrite (user feedback
    # 2026-08-21: a length cap produced unusably thin bodies; floors, not
    # caps).
    body_floors: {rule: 35, section: 25, confidence: 8}
    sightings_expiry_batches: 6
    run_root: learning/runs
  ab:
    # The A/B gate (grader-scoring §2.5): candidate-head vs incumbent-head
    # arms on same-task pairs. Waivable — not-run is recorded as not-run,
    # never as passed; when required, within-noise BLOCKS promotion.
    required: false
    pairs: 5
  codify:
    # The procedure code path (codify doc §7). min_recurrence gates the
    # seeder's layer-1 nomination; the run knobs govern the codify driver
    # (evolve minus ideation) and the freshness clock.
    min_recurrence: 2
    max_iterations: 3
    iteration_timeout_minutes: 60
    target: gcp_ephemeral   # D8: the dev box is not a run host; `local` for harness tests
    machine_type: g2-standard-8   # the gpu-class default for gpu preconditions
    replay_max_age_days: 60
    tolerance_z: 2
    # The run's two sessions (D4: implementor on the default intelligence,
    # the claims judge cross-model).
    implementor: {cli: codex, model: "gpt-5.6-sol", effort: "xhigh"}
    judge: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    gcp:
      project: trans-density-437811-p2
      zone: us-central1-a
      cpu_machine_type: e2-standard-8
      accelerator: type=nvidia-l4,count=1
      # The DLVM CPU families were retired; the cu129 ubuntu family boots
      # fine on CPU-only machines and carries /opt/conda.
      image_family: common-cu129-ubuntu-2204-nvidia-580
      image_project: deeplearning-platform-release
      boot_disk_gb: "200"
      # Prefixed to the evaluation command on the instance (env activation
      # + the one dep the DLVM image lacks; task-table downloads happen
      # inside the evaluation itself).
      bootstrap: "/opt/conda/bin/pip install --quiet relbench==2.1.2 && PATH=/opt/conda/bin:$PATH"
  develop:
    # The development regime (design §4.4): disposable banks, chronological
    # exam-then-ingest replay of the learn set, keep-best banking of learner
    # versions.
    batch_size: 3
    run_root: learning/develop
    versions_ledger: learning/versions.yaml
  behavior:
    # The semantic production suite (behavior-tests.md): real machinery on
    # known-truth fixtures, judged by a cross-model reviewer; FAIL gates
    # promotion like a gauntlet trap. Fixtures land with their phases.
    scenarios_dir: benchmarks/relbench/data/learning_behavior
    reviewer: {cli: claude_code, model: "claude-fable-5", effort: "xhigh", auth_mode: "oauth"}
    timeout_minutes: 60
    run_root: learning/behavior
