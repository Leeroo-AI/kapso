# Generic Problem Runner Configuration
# Configuration for solving arbitrary problems
#
# Usage:
#   python -m kapso.runner -p "Your problem..." -m GENERIC
#   python -m kapso.runner -f problem.txt -m MINIMAL
#
# Available Search Strategies:
#   - generic: evidence-directed Codex/Claude CLI ideation + implementation
#   - benchmark_tree_search: Tree search with handler.run() for benchmarks
#
# Knowledge Search Backends (via KnowledgeSearchFactory):
#   - kg_graph_search: Weaviate embeddings + Neo4j graph (for wiki pages)
#   - kg_llm_navigation: Neo4j KG with LLM-guided navigation (for JSON KG)
#
# Campaign memory:
#   - Executed experiments: .kapso/experiment_history.json
#   - Ideas and decisions: .kapso/idea_archive.json
#   - Experiment retrieval remains available through its MCP gate

# Default mode to use
default_mode: GENERIC

# Canonical deployment configuration for cross-run scientific memory and the
# expert repository. Workload configs carry only a typed cross_run_binding;
# generated runtime configs receive this tree plus its registry fingerprint.
cross_run:
  scopes:
    ml_ai:
      repositories:
        expert: "Leeroo-AI/kapso-expert"
        knowledge: "Leeroo-AI/kapso-knowledge"
  github:
    api_version: "2026-03-10"
    minimum_cli_version: "2.93.0"
    default_branch: "main"
    publisher_login: "leeroo-coder"
    commit_author_name: "Kapso Autonomous Publisher"
    commit_author_email: "kapso-publisher@users.noreply.github.com"
    expert_tag_prefix: "expert/"
    knowledge_tag_prefix: "knowledge/"
    cache_path: ".kapso/cross_run/github_cache"
    command_timeout_seconds: 120
    release_asset_size_bytes: &cross_run_asset_size_bytes 1073741824
    release_asset_count_limit: 16
    materialized_asset_size_bytes: 4294967296
    archive_entry_limit: 100000
    zstd_window_size_bytes: 134217728
    source_tree_size_bytes: 8388608
    source_entry_limit: 512
    git_tree_request_size_bytes: 33554432
    content_write_budget_per_minute: 80
    request_point_budget_per_minute: 900
    cache_entry_limit: 10000
    git_tree_metadata_size_bytes: 67108864
    control_blob_size_bytes: 262144
    cache_retention_releases: 3
  capture:
    state_path: ".kapso/cross_run/capture"
    quarantine_path: ".kapso/cross_run/quarantine"
    checkpoint_path: ".kapso/run_state.json"
    experiment_history_path: ".kapso/experiment_history.json"
    journal_filename: "execution_events.jsonl"
    bundle_asset_size_bytes: *cross_run_asset_size_bytes
    source_entry_limit: 10000
    git_command_timeout_seconds: 120
    git_command_output_bytes: 67108864
    score_comparison_tolerance: 1.0e-12
    capture_interval_seconds: 300
    quarantine_retention_generations: 1
  sanitation:
    policy_version: "kapso.sanitation.v1"
    max_file_bytes: 16777216
    allowed_suffixes: [".json", ".jsonl", ".md", ".py", ".toml", ".txt", ".yaml", ".yml"]
    allowed_filenames: ["Dockerfile", "LICENSE", "Makefile", "README"]
    allowed_spdx_licenses: ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MIT"]
    denied_path_patterns: [".aws", ".azure", ".bzr", ".cache", ".docker", ".dvc", ".env", ".git", ".gnupg", ".hg", ".mypy_cache", ".netrc", ".npmrc", ".pypirc", ".pytest_cache", ".ruff_cache", ".ssh", ".svn", "__pycache__", "auth.json", "cache", "caches", "checkpoints", "data", "dataset", "datasets", "evaluation", "evaluations", "evaluator", "evaluators", "hidden_eval", "hidden_evaluation", "hidden_evaluator", "kapso_datasets", "kapso_evaluation", "model_weights", "outputs", "task_outputs", "token:credential", "token:credentials", "token:secret", "token:secrets", "training_data", "weights"]
  catalog:
    state_path: ".kapso/cross_run/catalog"
    agent_artifact_path: ".kapso/cross_run/catalog_agent_calls"
    termination_grace_seconds: 5
    sensitive_file_glob_scan_max_depth: 8
    claim_packet_record_limit: 32
    review_packet_record_limit: 32
    claim_proposer_id: "catalog_claim_proposer"
    claim_proposer_role: "scientific_claim_proposer"
    claim_proposer:
      cli: "codex"
      model: "gpt-5.6-sol"
      timeout_seconds: 300
      effort: "high"
      allowed_tools: []
    reviewers:
      - reviewer_id: "catalog_reviewer_primary"
        reviewer_role: "independent_scientific_reviewer"
        rubric_version: "kapso.catalog_review.v1"
        agent:
          cli: "codex"
          model: "gpt-5.6-sol"
          timeout_seconds: 300
          effort: "xhigh"
          allowed_tools: []
      - reviewer_id: "catalog_reviewer_secondary"
        reviewer_role: "independent_scientific_reviewer"
        rubric_version: "kapso.catalog_review.v1"
        agent:
          cli: "codex"
          model: "gpt-5.6-sol"
          timeout_seconds: 300
          effort: "xhigh"
          allowed_tools: []
    admission:
      policy_version: "kapso.catalog_admission.v1"
      approval_judgment: "approve"
      rejection_judgment: "reject"
      required_approvals: 2
      required_rejections: 2
      minimum_supporting_runs: 2
      minimum_supporting_task_contexts: 1
      require_comparable_support: true
      require_isolated_support: true
    publication_interval_runs: 1
  knowledge:
    snapshot_path: ".kapso/cross_run/knowledge"
    index_path: ".kapso/cross_run/knowledge_index"
    archive_compression_level: 9
    embeddings:
      enabled: true
      provider: "openai"
      model: &default_embedding_model "text-embedding-3-small"
      dimensions: &default_embedding_dimensions 1536
      batch_size: &default_embedding_batch_size 64
      timeout_seconds: 60
      max_retries: 2
      canonicalizer_version: "kapso.knowledge_embedding.v1"
    retrieval:
      lexical_weight: 0.35
      max_records: 24
      max_records_per_run: 4
      max_records_per_family: 16
      max_records_per_lineage: 4
      max_records_per_outcome: 8
      max_records_per_type: 12
      prompt_byte_budget: 48000
      materialization_byte_budget: 65536
  expert:
    candidate_path: ".kapso/cross_run/expert_candidates"
    agent_artifact_path: ".kapso/cross_run/expert_agent_calls"
    candidate_entry_limit: 10000
    candidate_byte_limit: *cross_run_asset_size_bytes
    termination_grace_seconds: 5
    sensitive_file_glob_scan_max_depth: 8
    architect_id: "expert_repository_architect"
    architect_role: "expert_repository_architect"
    architect:
      cli: "claude_code"
      model: "fable"
      timeout_seconds: 900
      effort: "xhigh"
      allowed_tools: ["Edit", "Glob", "Grep", "Read", "Write"]
    generalizer_id: "expert_capability_generalizer"
    generalizer_role: "expert_capability_generalizer"
    generalizer:
      cli: "codex"
      model: "gpt-5.6-sol"
      timeout_seconds: 900
      effort: "xhigh"
      allowed_tools: ["Read"]
    triggers:
      policy_version: "kapso.expert_triggers.v1"
      inspection_policy_version: "kapso.expert_inspection.v1"
      inspector_id: "expert_trigger_inspector"
      inspector_role: "expert_trigger_inspector"
      minimum_failure_lineages: 2
      minimum_failure_contexts: 2
      minimum_success_lineages: 2
      minimum_success_contexts: 2
      minimum_duplicate_files: 2
      maximum_ancestor_candidates: 4
    validation:
      reviewer_cli: "claude_code"
      reviewer_count: 2
      sealed_canary_enabled: false
      maximum_regression_ratio: 0.0
      minimum_independent_contexts: 2
      timeout_seconds: 21600
  launch:
    cache_path: ".kapso/cross_run/launch_cache"
    bootstrap_pin_path: ".kapso/bootstrap_pin.json"
    artifact_ttl_seconds: 604800
    denylist_refresh_seconds: 300
  production_validation:
    fixture_path: "tests/fixtures/cross_run"
    github_write_smoke: true
    embedding_smoke: true
    coding_agent_smoke: true
    task_smoke_timeout_seconds: 21600

# One shared source for evidence-directed ideation operating parameters.
ideation_profiles:
  DEFAULT:
    archive_path: ".kapso/idea_archive.json"
    evidence:
      comparable_fidelity: "full"
      comparable_fraction: 1.0
      minimum_repeat_measurements: 2
      minimum_credible_delta: 0.01
      surprising_gain_multiplier: 3.0
      proxy_divergence_threshold: 0.03
      plateau_window: 3
      diversity_window: 4
      gap_debt_threshold: 2
    gaps:
      default_evidence_confidence: 0.25
      default_uncertainty_reduction: 0.25
      default_cost: 1.0
      minimum_cost: 0.01
    operators:
      candidate_quota: 2
      repair_quota: 1
      reserve_gap_slot: true
    coding_agents:
      artifact_path: ".kapso/ideation/agent_calls"
      termination_grace_seconds: 5
      sensitive_file_glob_scan_max_depth: 8
      generator:
        members:
          - cli: "codex"
            model: "gpt-5.6-sol"
            timeout_seconds: 300
            effort: "high"
            allowed_tools: ["Read", "WebSearch"]
          - cli: "claude_code"
            model: "us.anthropic.claude-opus-4-6-v1"
            timeout_seconds: 300
            effort: "high"
            allowed_tools: ["Read", "Glob", "Grep", "WebSearch"]
        repair_member:
          cli: "codex"
          model: "gpt-5.6-sol"
          timeout_seconds: 300
          effort: "high"
          allowed_tools: ["Read", "WebSearch"]
      selector:
        cli: "codex"
        model: "gpt-5.6-sol"
        timeout_seconds: 300
        effort: "high"
        allowed_tools: ["Read"]
      evidence_author:
        cli: "codex"
        model: "gpt-5.6-sol"
        timeout_seconds: 300
        effort: "high"
        allowed_tools: ["Read"]
    embeddings:
      enabled: true
      provider: "openai"
      model: *default_embedding_model
      dimensions: *default_embedding_dimensions
      batch_size: *default_embedding_batch_size
      timeout_seconds: 30
      max_retries: 0
      canonicalizer_version: "kapso.idea_embedding.v1"
    analyzer:
      semantic_similarity_threshold: 0.92
      max_neighbors: 5
      minimum_distinct_eligible: 2

# =============================================================================
# Available configuration modes
# =============================================================================
modes:
  # ===========================================
  # Production Mode
  # ===========================================
  
  # Standard configuration for generic problems
  # Uses the DEFAULT ideation profile; implementation keeps its MCP gates.
  GENERIC:
    ideation_profile: DEFAULT
    search_strategy:
      type: "generic"
      params:
        implementation_model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        gate_failure_policy: "warn"
        aws_region: "us-east-1"
        implementation_timeout: 600
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    models:
      utility: "gpt-4.1-mini"
      reasoning: "gpt-5-mini"
      web_search: "openai/gpt-4o-search-preview"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 600
    
    feedback_generator:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    # Knowledge search configuration
    # All model/collection details are in knowledge_search.yaml presets.
    # Use index_kg() to index data, then pass kg_index to Kapso.
    knowledge_search:
      type: "kg_graph_search"
      enabled: true
      preset: "DEFAULT"
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 1800
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 3600

  # ===========================================
  # Testing Modes
  # ===========================================
  
  # Minimal configuration for quick testing
  MINIMAL:
    ideation_profile: DEFAULT
    search_strategy:
      type: "generic"
      params:
        implementation_model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        gate_failure_policy: "warn"
        aws_region: "us-east-1"
        implementation_timeout: 300
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    models:
      utility: "gpt-4.1-mini"
      reasoning: "gpt-5-mini"
      web_search: "openai/gpt-4o-search-preview"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    feedback_generator:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 600
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 1800
