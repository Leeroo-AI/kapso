# Generic Problem Runner Configuration
# Configuration for solving arbitrary problems
#
# Usage:
#   python -m kapso.runner -p "Your problem..." -m GENERIC
#   python -m kapso.runner -f problem.txt -m MINIMAL
#
# Available Search Strategies:
#   - generic: evidence-directed Codex/Claude CLI ideation + implementation
#   - benchmark_tree_search: Tree search with handler.run() for benchmarks
#
# Knowledge Search Backends (via KnowledgeSearchFactory):
#   - kg_graph_search: Weaviate embeddings + Neo4j graph (for wiki pages)
#   - kg_llm_navigation: Neo4j KG with LLM-guided navigation (for JSON KG)
#
# Campaign memory:
#   - Executed experiments: .kapso/experiment_history.json
#   - Ideas and decisions: .kapso/idea_archive.json
#   - Experiment retrieval remains available through its MCP gate

# Default mode to use
default_mode: GENERIC

# Canonical deployment configuration for cross-run scientific memory and the
# expert repository. Workload configs carry only a typed cross_run_binding;
# generated runtime configs receive this tree plus its registry fingerprint.
cross_run:
  scopes:
    ml_ai:
      repositories:
        expert: "Leeroo-AI/kapso-expert"
        knowledge: "Leeroo-AI/kapso-knowledge"
  github:
    default_branch: "main"
    expert_tag_prefix: "expert/"
    knowledge_tag_prefix: "knowledge/"
    cache_path: ".kapso/cross_run/github_cache"
    command_timeout_seconds: 120
    release_asset_size_bytes: &cross_run_asset_size_bytes 1073741824
    cache_retention_releases: 3
    publication_retry_limit: 2
  capture:
    state_path: ".kapso/cross_run/capture"
    quarantine_path: ".kapso/cross_run/quarantine"
    journal_filename: "execution_events.jsonl"
    bundle_asset_size_bytes: *cross_run_asset_size_bytes
    capture_interval_seconds: 300
  sanitation:
    policy_version: "kapso.sanitation.v1"
    max_file_bytes: 16777216
    allowed_suffixes: [".json", ".jsonl", ".md", ".py", ".toml", ".txt", ".yaml", ".yml"]
    denied_path_patterns: [".env", ".git", "auth.json", "credentials", "secrets"]
  catalog:
    state_path: ".kapso/cross_run/catalog"
    claim_proposer_cli: "codex"
    reviewer_cli: "claude_code"
    reviewer_count: 2
    publication_interval_runs: 1
  knowledge:
    snapshot_path: ".kapso/cross_run/knowledge"
    index_path: ".kapso/cross_run/knowledge_index"
    embeddings:
      provider: "openai"
      model: &default_embedding_model "text-embedding-3-small"
      dimensions: &default_embedding_dimensions 1536
      batch_size: 64
      timeout_seconds: 60
      max_retries: 2
    retrieval:
      lexical_weight: 0.35
      max_records: 24
      max_records_per_run: 4
      max_records_per_family: 16
      prompt_token_budget: 12000
  expert:
    candidate_path: ".kapso/cross_run/expert_candidates"
    architect_cli: "claude_code"
    generalizer_cli: "codex"
    validation:
      reviewer_cli: "claude_code"
      reviewer_count: 2
      sealed_canary_enabled: false
      maximum_regression_ratio: 0.0
      minimum_independent_contexts: 2
      timeout_seconds: 21600
  launch:
    cache_path: ".kapso/cross_run/launch_cache"
    bootstrap_pin_path: ".kapso/bootstrap_pin.json"
    artifact_ttl_seconds: 604800
    denylist_refresh_seconds: 300
  production_validation:
    fixture_path: "tests/fixtures/cross_run"
    github_write_smoke: true
    embedding_smoke: true
    coding_agent_smoke: true
    task_smoke_timeout_seconds: 21600

# One shared source for evidence-directed ideation operating parameters.
ideation_profiles:
  DEFAULT:
    archive_path: ".kapso/idea_archive.json"
    evidence:
      comparable_fidelity: "full"
      comparable_fraction: 1.0
      minimum_repeat_measurements: 2
      minimum_credible_delta: 0.01
      surprising_gain_multiplier: 3.0
      proxy_divergence_threshold: 0.03
      plateau_window: 3
      diversity_window: 4
      gap_debt_threshold: 2
    gaps:
      default_evidence_confidence: 0.25
      default_uncertainty_reduction: 0.25
      default_cost: 1.0
      minimum_cost: 0.01
    operators:
      candidate_quota: 2
      repair_quota: 1
      reserve_gap_slot: true
    coding_agents:
      artifact_path: ".kapso/ideation/agent_calls"
      termination_grace_seconds: 5
      generator:
        members:
          - cli: "codex"
            model: "gpt-5.6-sol"
            timeout_seconds: 300
            effort: "high"
            allowed_tools: ["Read", "WebSearch"]
          - cli: "claude_code"
            model: "us.anthropic.claude-opus-4-6-v1"
            timeout_seconds: 300
            effort: "high"
            allowed_tools: ["Read", "Glob", "Grep", "WebSearch"]
        repair_member:
          cli: "codex"
          model: "gpt-5.6-sol"
          timeout_seconds: 300
          effort: "high"
          allowed_tools: ["Read", "WebSearch"]
      selector:
        cli: "codex"
        model: "gpt-5.6-sol"
        timeout_seconds: 300
        effort: "high"
        allowed_tools: ["Read"]
      evidence_author:
        cli: "codex"
        model: "gpt-5.6-sol"
        timeout_seconds: 300
        effort: "high"
        allowed_tools: ["Read"]
    embeddings:
      enabled: true
      model: *default_embedding_model
      dimensions: *default_embedding_dimensions
      timeout_seconds: 30
      max_retries: 0
    analyzer:
      semantic_similarity_threshold: 0.92
      max_neighbors: 5
      minimum_distinct_eligible: 2

# =============================================================================
# Available configuration modes
# =============================================================================
modes:
  # ===========================================
  # Production Mode
  # ===========================================
  
  # Standard configuration for generic problems
  # Uses the DEFAULT ideation profile; implementation keeps its MCP gates.
  GENERIC:
    ideation_profile: DEFAULT
    search_strategy:
      type: "generic"
      params:
        implementation_model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        gate_failure_policy: "warn"
        aws_region: "us-east-1"
        implementation_timeout: 600
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    models:
      utility: "gpt-4.1-mini"
      reasoning: "gpt-5-mini"
      web_search: "openai/gpt-4o-search-preview"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 600
    
    feedback_generator:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    # Knowledge search configuration
    # All model/collection details are in knowledge_search.yaml presets.
    # Use index_kg() to index data, then pass kg_index to Kapso.
    knowledge_search:
      type: "kg_graph_search"
      enabled: true
      preset: "DEFAULT"
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 1800
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 3600

  # ===========================================
  # Testing Modes
  # ===========================================
  
  # Minimal configuration for quick testing
  MINIMAL:
    ideation_profile: DEFAULT
    search_strategy:
      type: "generic"
      params:
        implementation_model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        gate_failure_policy: "warn"
        aws_region: "us-east-1"
        implementation_timeout: 300
        implementation_gates: ["research", "repo_memory", "leeroopedia"]

    models:
      utility: "gpt-4.1-mini"
      reasoning: "gpt-5-mini"
      web_search: "openai/gpt-4o-search-preview"
      embedding: "text-embedding-3-small"
    retry:
      max_attempts: 2
      initial_delay_seconds: 5
      max_delay_seconds: 60
      multiplier: 2
      jitter: true
    
    coding_agent:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    feedback_generator:
      type: "claude_code"
      model: "us.anthropic.claude-opus-4-6-v1"
      debug_model: "us.anthropic.claude-opus-4-6-v1"
      agent_specific:
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        streaming: true
        timeout: 120
    
    knowledge_search:
      type: "kg_llm_navigation"
      enabled: false
    
    # Learner configuration for kapso.learn()
    learner:
      ingestor:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 600
        cleanup: true
        cleanup_staging: false
        fail_on_validation_errors: true
        github_repo_visibility: "private"
      merger:
        model: "us.anthropic.claude-opus-4-6-v1"
        auth_mode: "bedrock"
        aws_region: "us-east-1"
        timeout: 1800
