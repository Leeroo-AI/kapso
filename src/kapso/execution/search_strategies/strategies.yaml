# Search Strategies Configuration
#
# Default configurations for all registered search strategies.
# Each strategy has presets (modes) that can be referenced by benchmarks.
#
# Available strategies:
#   - generic: Claude Code + MCP gates for ideation and implementation
#
# To add configs for a new strategy:
# 1. Add a new section under 'strategies' with your strategy name
# 2. Define presets with 'params' matching your strategy's expected parameters
#
# Benchmark configs (e.g., benchmarks/mle/config.yaml) can override these defaults.

# Default strategy when none specified
default_strategy: "generic"

# Strategy configurations
strategies:
  # =========================================================================
  # Generic Search Strategy
  # =========================================================================
  generic:
    description: "Claude Code + MCP gates for ideation and implementation"
    
    presets:
      # Production preset - full capabilities
      PRODUCTION:
        params:
          idea_generation_model: "claude-opus-5"
          implementation_model: "claude-opus-5"
          auth_mode: "oauth"
          gate_failure_policy: "warn"
          ideation_timeout: 300
          implementation_timeout: 600
          ideation_gates: ["research", "experiment_history", "leeroopedia"]
          implementation_gates: ["research", "leeroopedia"]
      
      # Minimal for quick testing
      MINIMAL:
        params:
          idea_generation_model: "claude-opus-5"
          implementation_model: "claude-opus-5"
          auth_mode: "oauth"
          gate_failure_policy: "warn"
          ideation_timeout: 180
          implementation_timeout: 300
          ideation_gates: ["research", "experiment_history", "leeroopedia"]
          implementation_gates: ["research", "leeroopedia"]
    
    default_preset: "PRODUCTION"
